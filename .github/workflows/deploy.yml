name: Deploy to GitHub Pages

# Build the Vite site and publish dist/ — NOT the raw source. Serving the
# source directly (the old "Pages from branch: main /" setting) is exactly what
# broke the site: the browser hit the un-bundled `import 'gsap'` and the film
# never ran. This builds first, so gsap is bundled and every asset carries the
# /happy-birthday-tree/ base path.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token that can publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_ready: ${{ steps.pages-ready.outputs.pages_ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - id: configure-pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true
      - id: pages-ready
        if: always()
        run: |
          if [ "${{ steps.configure-pages.outcome }}" = "success" ]; then
            echo "pages_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "pages_ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Pages deployment because repository Pages could not be configured by this workflow token."
          fi
      - if: steps.pages-ready.outputs.pages_ready == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: needs.build.outputs.pages_ready == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
